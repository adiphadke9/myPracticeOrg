<template>
    <lightning-card title="Dropbox File Manager" icon-name="standard:file" variant="brand">
        <span>Upload file for {name}</span>
        <div class="slds-p-around_large">
            <lightning-file-upload
              label="Upload File"
              name="fileUploader"
              record-id={recordId}
              onuploadfinished={handleUploadFinished}
              multiple>
            </lightning-file-upload>
        </div>
    </lightning-card>    
</template>
